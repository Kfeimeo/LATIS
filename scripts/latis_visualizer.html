<style>
:root{color-scheme:light;--ink:#152b3d;--muted:#526879;--line:#dbe5ec;--accent:#087f8c;--paper:#f2f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
header{background:#102a3b;color:#fff;padding:24px 32px;display:flex;gap:24px;align-items:center;justify-content:space-between}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#b9d0df;font-size:13px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 105px)}aside{padding:20px 14px;border-right:1px solid var(--line);background:#fff}main{min-width:0;padding:24px 28px;max-width:1800px}
label{display:block;font-size:13px;color:var(--muted)}input[type=search]{width:100%;padding:10px;border:1px solid #bacbd6;border-radius:7px;margin:6px 0 12px}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px 12px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #20b4c5;outline-offset:2px}
.task{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;overflow-wrap:anywhere}.task.active{background:#e5f4f4;border-color:var(--accent)}.task small{display:block;color:var(--muted)}.task b{font-size:14px}.muted{color:var(--muted)}.small{font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h2{margin:0;font-size:25px}h3{margin:0 0 12px;font-size:18px}h4{margin:0 0 8px}.badges{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:#e7edf3}.good{background:#d9f3e9;color:#12563e}.bad{background:#ffe5dc;color:#8d3016}.unknown{background:#edf0f3;color:#4a5f70}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.notice{padding:12px 15px;border-left:3px solid #dc9a35;background:#fff6e5;margin:12px 0;overflow-wrap:anywhere}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.controls label{display:flex;gap:8px;align-items:center}.grids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.tile{min-width:0}.gridwrap{overflow:auto;padding:4px;max-height:610px;background:#eef2f5;border-radius:6px}.gridwrap svg{display:block;max-width:none}.tile p{margin:6px 0;color:var(--muted);font-size:12px}.empty{min-height:95px;padding:14px;background:#f2f5f8;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.split{margin:24px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}.program{white-space:pre;overflow:auto;background:#102a3b;color:#e3f0f5;padding:18px;border-radius:8px;font:13px/1.65 Consolas,monospace;max-height:600px}.wrap{white-space:pre-wrap;overflow-wrap:anywhere}.tree{padding-left:18px;border-left:1px solid var(--line);margin:6px 0}.tree summary{cursor:pointer;overflow-wrap:anywhere;font-family:Consolas,monospace;font-size:13px}.tree .type{font:11px system-ui;color:var(--muted);margin-left:8px}.nodeinfo{font-size:12px;padding:6px 10px;background:#f3f7fa;overflow-wrap:anywhere}.nodeinfo code{white-space:pre-wrap}.nodeinfo p{margin:4px 0}details>summary{cursor:pointer}details.panel>summary{font-weight:650}details.panel[open]>summary{margin-bottom:14px}.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{padding:12px;background:#f2f7fa;border-radius:7px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.meta{overflow-wrap:anywhere;font-size:12px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px}td{padding:6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}td:first-child{width:60%}footer{font-size:12px;color:var(--muted);margin:18px 0}.hidden{display:none}.legend{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #738391;font:12px monospace}
@media(max-width:1100px){.grids{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:220px minmax(0,1fr)}main{padding:18px}}
@media(max-width:650px){header{padding:18px}.shell{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}#tasks{max-height:200px;overflow:auto}.grids{grid-template-columns:1fr}main{padding:12px}.panel{padding:14px}}
@media print{aside,.controls,button{display:none}header{background:white;color:black}.shell{display:block}.panel{break-inside:avoid}.gridwrap svg{max-width:100%;height:auto!important}.gridwrap{max-height:none}.program{max-height:none}}
</style>
<style>
.definition-slot button[data-arrow]::before{content:attr(data-arrow);margin-right:8px}.signature-editor{padding:12px;border-top:1px solid #64748b}.parameter-tray button{margin:4px}.block-layout[hidden],.signature-editor[hidden]{display:none}
.ide-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:16px;margin:12px 0}.ide-layout textarea{width:100%;min-height:440px;font:14px/1.6 Consolas,monospace;tab-size:2;padding:14px;background:#101b2b;color:#e4edf5;border:1px solid #64748b;box-sizing:border-box}.ide-layout aside{overflow:auto;max-height:500px}.ide-layout pre{white-space:pre-wrap}.ide-grid>div{display:flex}.ide-grid span{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;color:white;text-shadow:0 0 2px black;font-size:11px}@media(max-width:800px){.ide-layout{grid-template-columns:1fr}}
.definition-slots{display:grid;gap:8px;margin:16px 0}.definition-slot{padding:12px;border:1px solid #64748b;border-radius:8px}.definition-slot.active{border:2px solid #38bdf8}.definition-slot>span,.definition-slot>label{margin:0 12px}.definition-slot pre{max-height:100px;overflow:auto}
.block-editor{border-top:4px solid #087f8c}.block-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.block-toolbar label{max-width:220px}.block-status{padding:14px;border-radius:8px;overflow-wrap:anywhere}.block-layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px;margin:18px 0}.block-palette{padding:12px;background:#f2f7fa;border-radius:8px;align-self:start;position:sticky;top:8px;max-height:80vh;overflow:auto}.block-palette input,.block-palette select,.block-fields input:not([type=range]),.block-fields select{max-width:100%;padding:6px;border:1px solid #b6cbd6;border-radius:5px}.block-palette label{margin-bottom:10px}.palette-block{display:block;width:100%;text-align:left;margin:5px 0;padding:5px 8px;font:13px Consolas,monospace}.program-block{padding:10px;border:1px solid #b8cdd6;border-left:4px solid #559cab;border-radius:8px;background:#fff;margin:7px 0;min-width:0}.program-block.selected{outline:2px solid #087f8c;outline-offset:1px;background:#f0fbfa}.program-block.hole{border-style:dashed;background:#f6f8fa}.program-block .program-block{margin-left:12px}.block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.block-head button{font:13px Consolas,monospace}.block-fields{display:flex;gap:8px;flex-wrap:wrap}.block-fields label{max-width:250px}.block-fields label input{display:block}.block-fields input[type=range]{max-width:150px}.slot-label{font-size:11px;color:#526879;margin-top:8px}.block-workspace{overflow:auto;max-height:850px;padding:4px}.block-editor button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:800px){.block-layout{grid-template-columns:1fr}.block-palette{position:static;max-height:270px}.program-block .program-block{margin-left:3px}.block-workspace{max-height:650px}}
</style>
<header><div><h1>LATIS / 案例与程序</h1><p>Training · Heldout · Base program · Portfolio</p></div><span class="small">离线报告 · 不重新搜索</span></header>
<div class="shell"><aside><label for="search">搜索题目 / 模式</label><input id="search" type="search" placeholder="03560426 / scan / Full"><label><input id="failOnly" type="checkbox"> 仅看 heldout 未通过</label><p id="count" class="small muted"></p><nav id="tasks" aria-label="题目列表"></nav></aside>
<main><div id="intro"></div><section class="panel"><div class="controls"><label>像素大小 <input id="zoom" type="range" min="8" max="30" value="16"><span id="zoomValue">16</span></label><label><input type="checkbox" id="numbers"> 显示颜色编号</label><label><input type="checkbox" id="onlyWrong"> 仅看重放不匹配样例</label></div><p class="small muted">悬停像素可查看 (x, y) 与颜色。差异图：灰色相同，红色不同，紫色表示尺寸缺失区域。</p><div class="legend" id="legend"></div></section>
<section class="panel" id="programSection"><div class="top"><h3>已选程序</h3><div><button id="copy">复制原始程序</button> <button id="wrap">切换换行</button></div></div><pre id="program" class="program"></pre><details><summary>类型 AST · 点击节点展开</summary><div id="ast"></div></details></section>
<section id="builder"></section><div id="cases"></div><div id="extra"></div><footer id="footer"></footer></main></div>
<script>__LATIS_BLOCKS__</script>

<script type="application/json" id="data">__LATIS_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),items=data.items;
const colors=['#000000','#0074D9','#FF4136','#2ECC40','#FFDC00','#AAAAAA','#F012BE','#FF851B','#7FDBFF','#870C25'];
let selected=Math.max(0,items.findIndex(x=>x.name==='03560426'&&x.mode==='Full'));const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function badge(label,value){return el('span',label+': '+(value===true?'exact':value===false?'未通过':'未知'), 'badge '+(value===true?'good':value===false?'bad':'unknown'));}
function panel(title){const n=el('section',undefined,'panel');if(title)n.append(el('h3',title));return n;}
function isGrid(g){return Array.isArray(g)&&g.length>0&&Array.isArray(g[0])&&g[0].length>0&&g.every(r=>Array.isArray(r)&&r.length===g[0].length&&r.every(c=>Number.isInteger(c)&&c>=0&&c<=9));}
function same(a,b){return isGrid(a)&&isGrid(b)&&JSON.stringify(a)===JSON.stringify(b);}
function svgGrid(g,other=null){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const h=Math.max(g.length,other?.length||0),w=Math.max(g[0].length,other?.[0]?.length||0),sz=Number($('zoom').value);svg.setAttribute('viewBox',`0 0 ${w*20} ${h*20}`);svg.setAttribute('width',w*sz);svg.setAttribute('height',h*sz);svg.setAttribute('role','img');svg.setAttribute('aria-label',`${w}列 ${h}行${other?'差异图':'网格'}`);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=g[y]?.[x],v2=other?.[y]?.[x],r=document.createElementNS(ns,'rect');r.setAttribute('x',x*20);r.setAttribute('y',y*20);r.setAttribute('width',20);r.setAttribute('height',20);r.setAttribute('fill',other?(v===undefined||v2===undefined?'#9e56c0':v===v2?'#d8e2e9':'#eb5347'):colors[v]);r.setAttribute('stroke','#536372');r.setAttribute('stroke-width','.5');const t=document.createElementNS(ns,'title');t.textContent=`(${x}, ${y}) ${other?`标准=${v??'无'} 预测=${v2??'无'}`:`颜色=${v}`}`;r.append(t);svg.append(r);if($('numbers').checked&&v!==undefined){const text=document.createElementNS(ns,'text');text.setAttribute('x',x*20+10);text.setAttribute('y',y*20+14);text.setAttribute('text-anchor','middle');text.setAttribute('font-size','11');text.setAttribute('fill',other||[3,4,5,7,8].includes(v)?'#102333':'white');text.textContent=String(v);text.setAttribute('pointer-events','none');svg.append(text);}}
 return svg;}
function tile(title,g,error,other=null){const n=el('div',undefined,'tile');n.append(el('h4',title));if(isGrid(g)&&(!other||isGrid(other))){const box=el('div',undefined,'gridwrap');box.append(svgGrid(g,other));n.append(box);let caption=`${g[0].length} × ${g.length}`;if(other){let diff=0;for(let y=0;y<Math.max(g.length,other.length);y++)for(let x=0;x<Math.max(g[0].length,other[0].length);x++)if(g[y]?.[x]!==other[y]?.[x])diff++;caption=`不同位置：${diff}；标准 ${g[0].length}×${g.length} / 预测 ${other[0].length}×${other.length}`;}n.append(el('p',caption));}else n.append(el('div',error||'无数据','empty'));return n;}
function nodeLabel(n){const s=n.expression;if(s.startsWith('(lambda '))return s.slice(1,s.indexOf('. '));if(s.startsWith('let '))return s.slice(0,s.indexOf('='));if(n.children?.length)return s.split('(')[0];return s;}
function tree(n,depth=0){const d=el('details',undefined,'tree');d.open=depth<2;const summary=el('summary',nodeLabel(n));summary.append(el('span',n.type,'type'));d.append(summary);const info=el('div',undefined,'nodeinfo');info.append(el('p','FV: '+(n.free_variables?.join(', ')||'∅')));const code=el('code',n.expression);info.append(code);d.append(info);for(const c of n.children||[])d.append(tree(c,depth+1));return d;}
function pretty(n,level=0){const s=n.expression,c=n.children||[],pad='  '.repeat(level);if(!c.length)return s;const lab=nodeLabel(n);if(s.length<90)return s;if(s.startsWith('(lambda '))return lab+'.\n'+pad+'  '+pretty(c[0],level+1);if(s.startsWith('let '))return lab+' =\n'+pad+'  '+pretty(c[0],level+1)+'\n'+pad+'in\n'+pad+'  '+pretty(c[1],level+1);return lab+'(\n'+c.map(x=>pad+'  '+pretty(x,level+1)).join(',\n')+'\n'+pad+')';}
function cases(item){const root=$('cases');root.replaceChildren();let shown=0;for(const split of ['train','test']){const section=el('div');section.append(el('h3',split==='train'?'Training · 学习用样例':'Heldout · 留出验证样例','split'));const pairs=item.task[split]||[];pairs.forEach((pair,i)=>{const replay=item.replay[split]?.[i]||{},pred=replay.prediction,expected=pair.output,exact=isGrid(expected)&&isGrid(pred)?same(expected,pred):(replay.error?false:null);if($('onlyWrong').checked&&exact===true)return;shown++;const box=panel();const heading=el('div',undefined,'top');heading.append(el('h3',`${split==='train'?'Train':'Heldout'} ${i+1}`),badge('本次重放',exact));box.append(heading);const g=el('div',undefined,'grids');g.append(tile('输入',pair.input),tile('标准输出',expected,'未提供标准答案'),tile('程序预测',pred,replay.error||item.replay.error||'没有预测'),isGrid(expected)&&isGrid(pred)?tile('像素差异',expected,null,pred):tile('像素差异',null,'需要标准输出和有效预测'));box.append(g);section.append(box);});if(!pairs.length)section.append(el('p','没有该分组样例','muted'));root.append(section);}if(!shown)root.append(el('p','当前筛选条件下没有样例。','notice'));}
function render(){const item=items[selected],s=item.solution;$('intro').replaceChildren();const head=el('div',undefined,'top');head.append(el('h2',item.name),el('span',item.mode,'badge'));$('intro').append(head);const badges=el('div',undefined,'badges');badges.append(badge('保存的 train',s.train_exact),badge('保存的 heldout',s.heldout_available===false?null:s.heldout_exact));if(s.failure&&s.failure!=='None')badges.append(el('span',s.failure,'badge bad'));$('intro').append(badges);
 const builder=$('builder');builder.replaceChildren();const mode=el('div'),blocks=el('div'),ide=el('div');mode.append(el('span','编辑模式：'));for(const [label,isIDE] of [['积木',false],['文本 IDE',true]]){const b=el('button',label);b.onclick=()=>{blocks.hidden=isIDE;ide.hidden=!isIDE;if(isIDE)LatisIDE.mount(ide,item);else LatisBlocks.mount(blocks,item);};mode.append(b);}builder.append(mode,blocks,ide);ide.hidden=true;LatisBlocks.mount(blocks,item);
 if(item.portfolio){const p=item.portfolio;const labeled=(item.task.test||[]).length>0&&item.task.test.every(q=>isGrid(q.output));$('intro').append(el('p',`已提取 portfolio：${p.count} 个训练通过候选；${labeled?`heldout 通过 ${p.heldout_correct} 个`:'未提供完整 heldout 标准答案，正确候选数未知'}。这是固定选择后的审计。`,'muted'));}
 if(item.replay.error)$('intro').append(el('p',item.replay.error,'notice'));
 const ast=s.typed_ast;$('program').textContent=ast?pretty(ast):(s.program||'未合成出程序');$('copy').disabled=!s.program;$('ast').replaceChildren();if(ast)$('ast').append(tree(ast));else $('ast').append(el('p','未提供 typed AST','muted'));cases(item);
 const extra=$('extra');extra.replaceChildren();const inventions=s.task_invented||[];if(inventions.length){const inv=el('details',undefined,'panel');inv.append(el('summary',`Task-local inventions · ${inventions.length}`));for(const i of inventions){inv.append(el('h4',`${i.name} · MDL saving ${i.mdl_saving??'未知'}`));if(i.originating_ast)inv.append(tree(i.originating_ast));}extra.append(inv);}
 const a=s.ambiguity;if(a?.status==='ObservationallyUnderdetermined'){const p=el('details',undefined,'panel');p.append(el('summary','Training 不可辨识 · distinguishing input'));p.append(el('p','以下为假想输入上的两个不同预测，没有标准答案，也不参与程序选择。','notice'));const grids=el('div',undefined,'grids');grids.append(tile('区分输入',a.distinguishing_input),tile('假设 A 的预测',a.hypothetical_prediction_a),tile('假设 B 的预测',a.hypothetical_prediction_b));p.append(grids);p.append(el('pre','A: '+a.hypothesis_a+'\n\nB: '+a.hypothesis_b,'program wrap'));extra.append(p);}
 const stats=el('details',undefined,'panel');stats.append(el('summary','搜索统计与来源'));const numbers=el('div',undefined,'statgrid');for(const [key,label] of [['equivalence_classes','等价类'],['structural_representatives','结构代表'],['cost_bound_reached','Cost bound reached'],['total_expanded_work','Total work'],['first_solution_states','First-solution work'],['exact_verifier_calls','Exact calls'],['selected_let_bindings','已选 let 数量'],['wall_clock_seconds','Solver seconds']]){const stat=el('div',undefined,'stat');stat.append(el('b',s.statistics?.[key]??'—'),el('span',label));numbers.append(stat);}stats.append(numbers);const table=el('table');for(const [key,value] of Object.entries(s.statistics||{})){const tr=el('tr');tr.append(el('td',key),el('td',typeof value==='object'?JSON.stringify(value):String(value)));table.append(tr);}stats.append(table);stats.append(el('p','Solution: '+item.solution_path,'meta'),el('p','Task: '+item.task_path,'meta'),el('p','Task SHA256: '+item.task_sha256,'meta'));extra.append(stats);
 $('footer').textContent=`重放：当前 Haskell Base 内核 + 默认同色四连通编码器。原结果未改写；不执行 synthesis。Base SHA256: ${data.base_sha256}。保存结果与重放分别显示，源码变化可能导致结果不同。`;
 for(const b of $('tasks').children)b.classList.toggle('active',Number(b.dataset.index)===selected);
}
function nav(){const query=$('search').value.toLowerCase(),fail=$('failOnly').checked;$('tasks').replaceChildren();let count=0;items.forEach((item,i)=>{if(!(item.name+' '+item.mode).toLowerCase().includes(query)||(fail&&item.solution.heldout_exact===true))return;count++;const b=el('button',undefined,'task');b.dataset.index=i;b.append(el('b',item.name),el('small',item.mode+' · '+(item.solution.heldout_exact===true?'heldout exact':item.solution.failure||'heldout 未通过')));b.onclick=()=>{selected=i;render();};$('tasks').append(b);});$('count').textContent=`${count} / ${items.length} 个执行结果`;
 if(!$('tasks').querySelector(`[data-index="${selected}"]`)&&$('tasks').firstChild)selected=Number($('tasks').firstChild.dataset.index);render();}
$('search').oninput=nav;$('failOnly').onchange=nav;$('onlyWrong').onchange=()=>cases(items[selected]);$('numbers').onchange=render;$('zoom').oninput=()=>{$('zoomValue').textContent=$('zoom').value;render();};$('wrap').onclick=()=>$('program').classList.toggle('wrap');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(items[selected].solution.program);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制原始程序',1500);}catch{const r=document.createRange();r.selectNodeContents($('program'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(r);$('copy').textContent='已选中，请 Ctrl+C';}};
colors.forEach((c,i)=>{const n=el('span',String(i),'swatch');n.style.background=c;n.style.color=[3,4,5,7,8].includes(i)?'#102333':'white';$('legend').append(n);});nav();
</script>
</html>
