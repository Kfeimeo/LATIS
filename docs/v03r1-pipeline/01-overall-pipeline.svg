<text x="80" y="570.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#087F8C">真正反馈给 Learn</text>
<text x="80" y="630.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#52677E">安装函数 → 清除旧 memo</text>
<text x="80" y="671.44" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#52677E">重学根问题 / 求解后续需求</text>
<text x="80" y="712.88" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#52677E">调用时展开定义并检查约束</text>
<rect x="72" y="846" width="1180" height="120" rx="18" fill="white"/>
<rect x="72" y="846" width="6" height="120" rx="3" fill="#2563EB"/>
<text x="96" y="866.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#172B43">08  选择与执行</text>
<text x="96" y="924.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#52677E">最终 frontier → 原 grid exact verification → rank → 选程序 → heldout 预测</text>
<polyline points="1848,430 1874,430 1874,831 1215,831 1215,842" fill="none" stroke="#087F8C" stroke-width="4"/>
