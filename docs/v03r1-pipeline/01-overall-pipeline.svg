<title>从训练示例到可执行程序</title>
<text x="72" y="37.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#2563EB">LATIS  /  v0.3R.1</text>
<text x="72" y="86.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="48" fill="#172B43">从训练示例到可执行程序</text>
<text x="74" y="151.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#52677E">输入是 ARC 训练 IO；搜索得到普通 Base 程序，并在当前 task 内学习可复用的函数。</text>
<text x="1780" y="42.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#52677E">01 / 05</text>
<rect x="72" y="245" width="336" height="235" rx="18" fill="white"/>
<rect x="72" y="245" width="6" height="235" rx="3" fill="#2563EB"/>
<text x="96" y="265.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#172B43">01  训练 IO</text>
<text x="96" y="323.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">输入 / 输出 grids</text>
<text x="96" y="360.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">Encode → latent Scene</text>
<text x="96" y="397.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">保留原 grid 做最终验证</text>
<rect x="432" y="245" width="336" height="235" rx="18" fill="white"/>
<rect x="432" y="245" width="6" height="235" rx="3" fill="#2563EB"/>
<text x="456" y="265.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#172B43">02  类型化约束</text>
<text x="456" y="323.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">Scene → Scene 函数图</text>
<text x="456" y="360.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">每个示例是一条约束</text>
<text x="456" y="397.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">只有训练 labels 进入搜索</text>
<rect x="792" y="245" width="336" height="235" rx="18" fill="white"/>
<rect x="792" y="245" width="6" height="235" rx="3" fill="#2563EB"/>
<text x="816" y="265.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#172B43">03  Learn</text>
<text x="816" y="323.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">类型 + 有限观测表达式</text>
<text x="816" y="360.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">generic Base witnesses</text>
<text x="816" y="397.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">递归求解子约束</text>
<rect x="1152" y="245" width="336" height="235" rx="18" fill="white"/>
<rect x="1152" y="245" width="6" height="235" rx="3" fill="#2563EB"/>
<text x="1176" y="265.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#172B43">04  Version space</text>
<text x="1176" y="323.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">Leaf：已匹配表达式</text>
<text x="1176" y="360.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">Union：候选方案</text>
<text x="1176" y="397.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">Join：组合子程序</text>
<rect x="1512" y="245" width="336" height="235" rx="18" fill="white"/>
<rect x="1512" y="245" width="6" height="235" rx="3" fill="#2563EB"/>
<text x="1536" y="265.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#172B43">05  Frontier</text>
<text x="1536" y="323.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">提取有限完整 AST</text>
<text x="1536" y="360.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">过滤 exact-spec 程序</text>
<text x="1536" y="397.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#52677E">作为 discovery 的证据</text>
