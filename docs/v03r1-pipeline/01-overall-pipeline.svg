<text x="674" y="648.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#52677E">已获支持的 Base symbols</text>
<text x="674" y="687.96" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#52677E">+ 接受的 inventions</text>
<text x="674" y="727.92" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#52677E">当前 task 结束后丢弃</text>
