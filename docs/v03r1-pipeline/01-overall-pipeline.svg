<text x="1300" y="850.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="31" fill="#172B43">有限循环</text>
<text x="1300" y="898.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#52677E">最多 2 rounds / 6 inventions</text>
<text x="1300" y="936.48" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#52677E">AST ≤ 96 / 参数 ≤ 4</text>
<polyline points="72,1017 1848,1017" fill="none" stroke="#D7E0EC" stroke-width="2"/>
<text x="74" y="1033.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#52677E">固定 Base · StructuralPriorCount = 0 · 不跨 task 传递 dictionary · heldout 仅在程序选定后评估</text>
