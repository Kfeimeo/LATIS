<text x="1134" y="590.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#172B43">06  自动 abstraction</text>
<text x="1134" y="648.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#52677E">Typed anti-unification → lambda lifting</text>
<text x="1134" y="689.44" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#52677E">检查 closed / typed / Base-expandable</text>
<text x="1134" y="730.88" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#52677E">只有 portfolio MDL 净节省 &gt; 0 才接受</text>
<polyline points="1680,480 1680,557" fill="none" stroke="#087F8C" stroke-width="4"/>
