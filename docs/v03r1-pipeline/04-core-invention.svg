<text x="99" y="776.0" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#172B43">完全由既有 Base 表达的定义</text>
<text x="99" y="831.0" dominant-baseline="text-before-edge" font-family="Consolas, monospace" font-size="29" fill="#172B43">I0(pair) = Translate(snd(pair),</text>
<text x="99" y="876.0" dominant-baseline="text-before-edge" font-family="Consolas, monospace" font-size="29" fill="#172B43">    coordDelta(Anchor(fst(pair),BR), Anchor(snd(pair),TL)))</text>
